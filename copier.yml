_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml
_exclude:
  - "{% if _copier_operation == 'update' %}README.md{% endif %}"

repository_name:
  type: str
  help: Repository name in kebab-case.
  validator: >-
    {% if not (repository_name | regex_search('^[a-z0-9]+(?:-[a-z0-9]+)*$')) %}
    Use lowercase kebab-case.
    {% endif %}

repository_description:
  type: str
  help: One-sentence repository purpose.
  default: Infrastructure repository managed with Ternforge.
