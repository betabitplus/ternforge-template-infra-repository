apiVersion: vendir.k14s.io/v1alpha1
kind: Config
directories:
  - path: template/_components
    contents:
      - path: .
        git:
          url: https://github.com/betabitplus/ternforge-template-components.git
          ref: v1.1.0
        includePaths:
          - components/repository/base/**/*
        excludePaths:
          - .git
          - .git/**/*
        legalPaths: []
