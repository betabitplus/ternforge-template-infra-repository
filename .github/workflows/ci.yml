name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  required:
    name: ci / required
    runs-on: ${{ vars.TERNFORGE_RUNNER || 'ubuntu-24.04' }}
    steps:
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            test

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configure git authentication for template self-clone
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: false

      - name: Verify fresh generated product
        env:
          GH_TOKEN: ${{ github.token }}
          TEMPLATE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/fresh"
          uvx --from copier==9.17.1 copier copy \
            --defaults \
            --data repository_name=acceptance-infra \
            --data repository_description='Acceptance infrastructure repository.' \
            --vcs-ref "$TEMPLATE_REF" \
            https://github.com/${{ github.repository }}.git \
            "$target"
          test -f "$target/.agents/AGENTS.md"
          test -f "$target/.editorconfig"
          test -f "$target/.gitattributes"
          test -f "$target/.gitignore"
          test -f "$target/LICENSE"
          test -f "$target/.github/pull_request_template.md"
          test -f "$target/.copier-answers.yml"
          test -f "$target/README.md"
          find "$target" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort >"$RUNNER_TEMP/top-level.txt"
          printf '%s\n' .agents .copier-answers.yml .editorconfig .gitattributes .github .gitignore LICENSE README.md | sort >"$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/top-level.txt"

      - name: Verify previous-release update ownership
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TEMPLATE_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          previous_tag="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          if [[ -z "$previous_tag" ]]; then
            echo 'No previous release exists yet; fresh acceptance is sufficient for bootstrap.'
            exit 0
          fi
          commit_project() {
            local project="$1"
            git -C "$project" init --initial-branch=main
            git -C "$project" config user.name 'Ternforge acceptance'
            git -C "$project" config user.email 'acceptance@ternforge.invalid'
            git -C "$project" add --all
            git -C "$project" commit -m 'test: prepare update fixture'
          }
          target="$RUNNER_TEMP/update"
          uvx --from copier==9.17.1 copier copy \
            --defaults \
            --data repository_name=acceptance-infra \
            --data repository_description='Acceptance infrastructure repository.' \
            --vcs-ref "$previous_tag" \
            https://github.com/${{ github.repository }}.git \
            "$target"
          printf '# Operator-owned README\n' >"$target/README.md"
          printf '# Operator-owned ignore\n' >>"$target/.gitignore"
          printf 'operator sentinel\n' >"$target/operator.txt"
          commit_project "$target"
          uvx --from copier==9.17.1 copier update --defaults --vcs-ref "$TEMPLATE_REF" "$target"
          grep -F '# Operator-owned README' "$target/README.md"
          grep -F '# Operator-owned ignore' "$target/.gitignore"
          grep -F 'operator sentinel' "$target/operator.txt"

          deleted="$RUNNER_TEMP/deleted-readme"
          uvx --from copier==9.17.1 copier copy \
            --defaults \
            --data repository_name=deleted-readme \
            --vcs-ref "$previous_tag" \
            https://github.com/${{ github.repository }}.git \
            "$deleted"
          rm "$deleted/README.md"
          commit_project "$deleted"
          uvx --from copier==9.17.1 copier update --defaults --vcs-ref "$TEMPLATE_REF" "$deleted"
          test ! -e "$deleted/README.md"

      - name: Verify repository files
        run: |
          set -euo pipefail
          git diff --check
          python -m json.tool release-please-config.json >/dev/null
          python -m json.tool .release-please-manifest.json >/dev/null
